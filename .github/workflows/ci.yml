# CI for the public fair-code repo.
#
# THIS FILE IS DELIBERATELY THIN. Every actual check lives in scripts/ci.sh, which you
# can run yourself:
#
#   bash scripts/ci.sh
#
# Two reasons for the split. A contributor can reproduce CI locally instead of
# discovering a failure after pushing. And this repository is a filtered mirror
# published by a job that authenticates with a repository deploy key, which GitHub does
# not permit to create or update anything under .github/workflows/. Keeping the steps
# out of this file means a change to a check no longer breaks the publish at its final
# push, after every gate has already passed.
#
# So: edit scripts/ci.sh freely. Editing THIS file is a rare, deliberate act (an action
# version bump, a trigger change) and needs a push from a credential holding the
# `workflow` scope.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the secret scan reads full history, not just the tip

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep the CI stdlib aligned with the Docker and release pins.
          # go-version-file reads the `go` language directive and may select
          # the older 1.25.x minimum instead of the security-patched toolchain.
          go-version: "1.26.10"
          cache: true

      - name: All checks (build, vet, test, gofmt, licenses, secrets, vulnerabilities)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_ci_uid.py
          mkdir -p "$(go env GOCACHE)" "$(go env GOPATH)"
          bun_args=(--bun-absent)
          if bun=$(command -v bun); then bun_args=(--bun "$bun"); fi
          sudo -n /usr/bin/python3 scripts/ci-uid.py --execute --mode all-checks \
            --workspace "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --runner-temp "$RUNNER_TEMP" --go-cache "$(go env GOCACHE)" \
            --gopath "$(go env GOPATH)" --go "$(command -v go)" \
            --tool-path "$PATH" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            "${bun_args[@]}"

  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reactor_test
          POSTGRES_PASSWORD: reactor_test
          POSTGRES_DB: reactor_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reactor_test -d reactor_ci_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: PostgreSQL migrations, journal contracts, HTTP MCP worker, and bounded queue probe
        env:
          REACTOR_TEST_POSTGRES_URL: postgres://reactor_test:reactor_test@127.0.0.1:5432/reactor_ci_test?sslmode=disable
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_ci_uid.py
          mkdir -p "$(go env GOCACHE)" "$(go env GOPATH)"
          bun_args=(--bun-absent)
          if bun=$(command -v bun); then bun_args=(--bun "$bun"); fi
          sudo -n /usr/bin/python3 scripts/ci-uid.py --execute --mode postgres \
            --workspace "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --runner-temp "$RUNNER_TEMP" --go-cache "$(go env GOCACHE)" \
            --gopath "$(go env GOPATH)" --go "$(command -v go)" \
            --tool-path "$PATH" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            "${bun_args[@]}"
